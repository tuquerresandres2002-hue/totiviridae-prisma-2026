      <text x="558" y="222" font-size="9.2" fill="#3D1C17">• Sin evaluación de virus Totiviridae: 62 (39.7%)</text>
      <text x="558" y="237" font-size="9.2" fill="#3D1C17">• Otros parásitos no flagelados o vectores: 44 (28.2%)</text>
      <text x="558" y="252" font-size="9.2" fill="#3D1C17">• Fuera de 2021–2026: 31 (19.9%) | Solo in silico: 19 (12.2%)</text>

