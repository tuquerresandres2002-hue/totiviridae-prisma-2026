      <text x="440" y="21" text-anchor="middle" font-size="13.5" font-weight="800" fill="#FFFFFF">DIAGRAMA DE FLUJO PRISMA 2020 — CRIBADO SISTEMÁTICO DOBLE CIEGO (2021–2026)</text>
      <text x="440" y="37" text-anchor="middle" font-size="10.2" fill="#CDE5D8">UPEC • Carrera de Laboratorio Clínico • Revisión Sistemática sobre Virus Endosimbiontes Totiviridae (LRV / TVV)</text>

