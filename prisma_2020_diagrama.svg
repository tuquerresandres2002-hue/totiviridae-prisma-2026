      <rect x="136" y="60" width="356" height="23" rx="4" fill="#134230"/>
      <text x="314" y="75.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">REGISTROS IDENTIFICADOS (2021–2026): N = 318</text>
      <text x="148" y="98" font-size="9.5" fill="#1D2E25">• PubMed / MEDLINE: 112 (35.2%)   • Scopus: 94 (29.6%)</text>
      <text x="148" y="115" font-size="9.5" fill="#1D2E25">• Web of Science Core Collection: 68 (21.4%)</text>
      <text x="148" y="132" font-size="9.5" fill="#1D2E25">• Embase: 29 (9.1%)   • LILACS / SciELO: 15 (4.7%)</text>
      <text x="148" y="147" font-size="8.8" font-weight="700" fill="#1F6347">Ventana: 1 de enero de 2021 al 13 de noviembre de 2026</text>

