      <text x="148" y="223" font-size="9.5" fill="#1D2E25">• Evaluación doble ciego por dos revisores independientes</text>
      <text x="148" y="240" font-size="9.5" font-weight="700" fill="#123C2B">• Concordancia Kappa de Cohen = 0.86 | PABAK = 0.90</text>
