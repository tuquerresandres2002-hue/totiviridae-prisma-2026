      <text x="558" y="116" font-size="9.4" fill="#3D1C17">• Coincidencia por PMID / Scopus EID: 24 (19.4%)</text>
      <text x="558" y="133" font-size="9.4" fill="#3D1C17">• Emparejamiento título + autor + año: 11 (8.9%)</text>
      <text x="558" y="147" font-size="9.2" font-weight="700" fill="#123C2B">► Registros únicos retenidos: n = 194 (61.0%)</text>

