      <text x="150" y="456" font-size="9.8" font-weight="700" fill="#123C2B">• Leishmania spp. + LRV1 / LRV2: 11 estudios (52.4%)   |   • Trichomonas vaginalis + TVV1–TVV5: 7 estudios (33.3%)</text>
      <text x="150" y="473" font-size="9.8" font-weight="700" fill="#123C2B">• Estudios comparativos multi-protozoo (Matrioska Microbiana / vesículas extracelulares): 3 estudios (14.3%)</text>
      <text x="150" y="489" font-size="9.4" fill="#1F4A36">Calidad Metodológica: 14 riesgo bajo (66.7%) • 3 bajo-moderado (14.3%) • 4 moderado (19.0%) • 0 riesgo crítico (0.0%)</text>
